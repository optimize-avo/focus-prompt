<div class="space-y-4">
    <h3 class="font-semibold text-white">Export</h3>
    <p class="text-sm text-slate-400">Export your project data.</p>

    <form hx-post="/api/export" hx-target="#export-result" hx-indicator="#export-spinner">
        <div class="mb-3">
            <label class="block text-sm font-medium text-slate-300 mb-1">Format</label>
            <select name="fmt" class="w-full bg-slate-700 border border-slate-600 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                <option value="json">JSON</option>
                <option value="csv">CSV</option>
            </select>
        </div>
        <div class="flex items-center gap-3">
            <button type="submit" class="flex items-center gap-2 px-4 py-2 bg-blue-600 hover:bg-blue-500 text-white rounded-lg text-sm font-medium transition-colors">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/>
                </svg>
                Export
            </button>
            <span id="export-spinner" class="htmx-indicator text-sm text-slate-400">
                <svg class="animate-spin h-4 w-4 inline mr-1" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                Exporting...
            </span>
        </div>
    </form>

    <div id="export-result"></div>
</div>
