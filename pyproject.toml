[project]
name = "focus-prompt"
version = "0.1.1"
description = "AI Brand Visibility Research Tool — Unbranded Prompt Discovery"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12.0",
    "pydantic>=2.0.0",
    "rich>=13.0.0",
    "httpx>=0.27.0",
    "litellm>=1.50.0",
    "python-dotenv>=1.0.0",
    "click>=8.0.0",
    "pyyaml>=6.0",
    "beautifulsoup4>=4.12.0",
    "mcp>=1.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "jinja2>=3.1.0",
    "python-multipart>=0.0.9",
    "sse-starlette>=2.0.0",
]

# CLI and MCP entry points removed 2026-07-22 — web app only mode.
# focus-prompt is now exclusively a web application (FastAPI).
# To restore (not recommended): see docs/CLI_MCP_DEPRECATED.md
# [project.scripts]
# fp = "fp.cli:app"
# fp-mcp = "fp.server:main"

[tool.setuptools.package-data]
"fp.web" = ["templates/**/*.html"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
